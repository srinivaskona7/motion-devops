<!doctype html>
<html lang="en" data-composition-variables='[{"id":"accent","type":"color","label":"Brand accent","default":"{{ACCENT}}"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITLE}} · KodeKloud Flow Template</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --accent: {{ACCENT}};
        --bg: #070a13;
        --k8s-blue: #326ce5;
        --card-bg: rgba(14, 19, 32, 0.85);
        --line: rgba(255, 255, 255, 0.1);
        --ink: #f0f4fc;
        --mute: #94a3b8;
        --ok: #22c55e;
        --warn: #f59e0b;
        --bad: #f43f5e;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        --mono: "JetBrains Mono", "SF Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: var(--sans); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); }

      /* Visual Cluster Container (KodeKloud style) */
      .cluster-box {
        position: absolute; border: 2px dashed rgba(50, 108, 229, 0.45);
        border-radius: 20px; background: rgba(50, 108, 229, 0.03);
      }
      .cluster-badge {
        position: absolute; top: -14px; left: 24px; padding: 4px 12px;
        background: var(--k8s-blue); color: #fff; font: 700 13px var(--mono);
        border-radius: 6px; letter-spacing: 0.08em; text-transform: uppercase;
      }

      /* Split Columns: Config vs Data */
      .col-box {
        position: absolute; background: var(--card-bg); border: 1px solid var(--line);
        border-radius: 16px; backdrop-filter: blur(20px); padding: 20px;
      }
      .col-title { font: 700 14px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }

      /* Flow Wires and Packet Beads */
      svg.wires { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
      .wire { fill: none; stroke: rgba(255, 255, 255, 0.15); stroke-width: 3; stroke-linecap: round; }
      .bead { fill: #fff; filter: drop-shadow(0 0 8px var(--accent)); }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- High-Impact Hook Thumbnail Title -->
      <div id="thumb-hook" style="position: absolute; left: 108px; top: 220px; width: 864px; z-index: 50;">
        <div style="font: 700 20px var(--mono); color: var(--accent); letter-spacing: 0.16em; text-transform: uppercase;">{{SUBTITLE}}</div>
        <h1 style="font-size: 64px; font-weight: 800; line-height: 1.06; margin-top: 14px; letter-spacing: -0.03em;">{{TITLE}}</h1>
      </div>

      <!-- Main Stage (Platform Safe Band: y: 430 - 1400) -->
      <div id="stage" style="position: absolute; left: 108px; top: 430px; width: 864px; height: 960px;">
        <!-- Cluster Boundary -->
        <div class="cluster-box" style="inset: 0;">
          <div class="cluster-badge">Kubernetes · Prod Cluster</div>
        </div>
      </div>
    </div>
  </body>
</html>
